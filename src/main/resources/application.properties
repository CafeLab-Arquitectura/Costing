spring.application.name=costing-cafelab

# Sin Spring Security en este microservicio: autenticacion en el API Gateway
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Puerto por defecto: 8084
server.port=${PORT:8084}

# PostgreSQL / Supabase o base de datos local / OCI
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?pgbouncer=true&sslmode=require&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=com.cafemetrix.cafelab.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Hibernate + PgBouncer transaction-mode: evita warnings de LOB no contextuales
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Cliente HTTP hacia el microservicio Management (validar ownership del coffeeLot).
# Cadena de fallback para no romper deploys: si MANAGEMENT_SERVICE_URL no esta seteada,
# cae a MONOLITH_BASE_URL (nombre viejo de la env var) y, en ultimo caso, a localhost.
management.base-url=${MANAGEMENT_SERVICE_URL:${MONOLITH_BASE_URL:http://localhost:8080}}

# Eureka Client
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761}/eureka
eureka.instance.instance-id=${WEBSITE_HOSTNAME:localhost}:${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${WEBSITE_HOSTNAME:localhost}
eureka.instance.secure-port-enabled=${EUREKA_SECURE_PORT_ENABLED:false}
eureka.instance.secure-port=443
eureka.instance.non-secure-port-enabled=${EUREKA_NON_SECURE_PORT_ENABLED:true}
eureka.instance.non-secure-port=${PORT:8084}

# Flyway
spring.flyway.enabled=false
